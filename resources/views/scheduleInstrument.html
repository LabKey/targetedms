    <div class="modal fade" id="cost-modal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Instrument Time</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="event-index">
                    <form class="form-horizontal">

                        <div class="form-group row">

                        <div class="form-group row">
                            <label class="col-sm-4 control-label">Setup fee</label>
                            <div class="col-sm-8">
                                <input id="setup-cost" name="setup-cost" type="text" readonly="true" class="form-control"/>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-sm-4 control-label">Instrument fee</label>

                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="close-event">

                    </button>
                    <button type="button" class="btn btn-primary" id="save-event">

</div>

<script type="text/javascript" nonce="<%=scriptNonce%>">
    $(function() {

        let project = LABKEY.ActionURL.getParameter('project');
        let instrument = LABKEY.ActionURL.getParameter('instrument');

        if (!project) {
            alert('No project selected');
            return;
        }

        let calendar = null;
        let eventToSave = {};
        let paymentMethods = [];
        LABKEY.Query.selectRows({
            schemaName: 'targetedms',
            queryName: 'msProject',
            sort: 'title',
            columns: 'Id,title',
            scope: this,
            success: function (result) {
                let rows = result.rows;
                let projectDropDown = '<label for="projectDropDown">Select Project:</label>';
                projectDropDown += '<select id="projectDropDown" name="projectDropDown">';
                for (let i = 0; i < rows.length; i++) {
                    // if project == rows[i].Id, then select this option
                    projectDropDown += '<option value="' + LABKEY.Utils.encodeHtml(rows[i].Id) + '" ' + (project == rows[i].Id ? 'selected' : '') + '>' + LABKEY.Utils.encodeHtml(rows[i].title) + '</option>';
                }
                projectDropDown += '</select>';

                jQuery('#projectDropDown').html(projectDropDown);

            }
        });

        LABKEY.Query.selectRows({
            schemaName: 'targetedms',
            queryName: 'msInstrument',
            sort: 'name',
            columns: 'Id,name',
            scope: this,
            success: function (result) {
                let rows = result.rows;
                let instrumentDropDown = '<label for="instrumentDropDown">Select Instrument:</label>';
                instrumentDropDown += '<select id="instrumentDropDown" name="instrumentDropDown">';
                for (let i = 0; i < rows.length; i++) {
                    // if instrument == rows[i].Id, then select this option
                    instrumentDropDown += '<option value="' + LABKEY.Utils.encodeHtml(rows[i].Id) + '" ' + (instrument == rows[i].Id ? 'selected' : '') + '>' + LABKEY.Utils.encodeHtml(rows[i].name) + '</option>';
                }
                instrumentDropDown += '</select>';
                jQuery('#instrumentDropDown').html(instrumentDropDown);
                loadInstrumentSchedule(function(instrumentSchedule) {
                    let currentYear = new Date().getFullYear();

                    var calendarEl = document.getElementById('calendar');

                    calendar = new FullCalendar.Calendar(calendarEl, {
                        headerToolbar: {
                            left: 'prev,next today',
                            center: 'title',
                            right: 'dayGridMonth,timeGridWeek,timeGridDay'
                        },
                        initialDate: new Date(),
                        navLinks: true, // can click day/week names to navigate views
                        selectable: true,
                        selectMirror: true,
                        eventContent: function(e) {

                            let content = '';
                            let bgColor = (e.event.extendedProps.project == project ? e.backgroundColor : 'gray');
                            let textColor = getContrastTextColor(stringToColor(bgColor));
                            let dateStr = DateFormat.format.date(e.event.start, LABKEY.container.formats.dateTimeFormat) + ' - ' + DateFormat.format.date(e.event.end, LABKEY.container.formats.dateTimeFormat);
                            let style = 'background-color: ' + bgColor + '; color: ' + textColor;
                            content += '<div class="event-tooltip-content" style="' + style + ';">'
                                        + '<div class="event-date">' + LABKEY.Utils.encodeHtml(dateStr) + '</div>'
                                        + '<div class="event-id" >' + 'Project : &nbsp' + LABKEY.Utils.encodeHtml(e.event.extendedProps.project) + '</div>'
                                    + '</div>';
                            return { html: content };
                        },
                        select: function(arg) {
                            editEvent({
                                startDate: arg.start,
                                endDate: arg.end,
                                id: null,
                                name: '',
                                notes: ''
                            });
                            calendar.unselect()
                        },
                        eventClick: function(arg) {
                            editEvent({
                                startDate: arg.event.start,
                                endDate: arg.event.end,
                                id: arg.event.id,
                                name: arg.event.extendedProps.name,
                                notes: arg.event.extendedProps.notes
                            });
                        },
                        editable: true,
                        dayMaxEvents: true, // allow "more" link when too many events

                    });

                    // remove loading text
                    calendarEl.innerHTML = '';
                    calendar.render();

        });

        LABKEY.Query.selectRows({
            schemaName: 'targetedms',
            queryName: 'paymentMethod',
            sort: 'name',
            columns: 'Id,UWBudgetNumber,worktag, budgetExpirationDate, name',
            scope: this,
            success: function (result) {
                let rows = result.rows;
                paymentMethodsData = rows;
                let paymentMethodDropDown = '<p>Select Payment Method(s): <p> <br/>'+
                        '<label for="paymentMethodDropDown">Payment Method:&nbsp</label>';
                paymentMethodDropDown += '<select id="paymentMethodDropDown" name="paymentMethodDropDown">';
                for (let i = 0; i < rows.length; i++) {
                    paymentMethodDropDown += '<option value="' + LABKEY.Utils.encodeHtml(rows[i].Id) + '">' + LABKEY.Utils.encodeHtml(rows[i].name) + '</option>';
                }
                paymentMethodDropDown += '</select>';

                paymentMethodDropDown += '&nbsp<input type="text" id="paymentMethodPercent" name="paymentMethodPercent" value="100" size="3" maxlength="3">';
                paymentMethodDropDown += '<label for="paymentMethodPercent">%</label>';

                jQuery('#paymentMethodDropDown').html(paymentMethodDropDown);

            }
        });

        //     success: function (result) {

        //         let instrumentOperatorDropDown = '<label for="instrumentOperatorDropDown">Select Instrument Operator:</label>';
        //         instrumentOperatorDropDown += '<select id="instrumentOperatorDropDown" name="instrumentOperatorDropDown">';
        //         for (let i = 0; i < rows.length; i++) {

        //         }
        //         instrumentOperatorDropDown += '</select>';
        //         jQuery('#instrumentOperatorDropDown').html(instrumentOperatorDropDown);

        function stringToColor(color) {
            // Create a temporary DOM element
            const tempElement = document.createElement('div');
            tempElement.style.color = color;
            document.body.appendChild(tempElement);

            // Get the computed color value
            const computedColor = window.getComputedStyle(tempElement).color;
            document.body.removeChild(tempElement);

            // Convert RGB to HEX
            const rgbValues = computedColor.match(/\d+/g).map(Number);
            if (rgbValues.length === 3) {
                const [r, g, b] = rgbValues;
                return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase()}`;
            }

            return null; // Return null if conversion fails
        }

        function getContrastTextColor(hexcolor){
            var r = parseInt(hexcolor.substring(1,3),16);
            var g = parseInt(hexcolor.substring(3,5),16);
            var b = parseInt(hexcolor.substring(5,7),16);
            var yiq = ((r*299)+(g*587)+(b*114))/1000;
            return (yiq >= 128) ? 'black' : 'white';
        }

        function editEvent(event) {
            let startDate = event.startDate;
            let endDate = event.endDate;

            let startDateFormatted = DateFormat.format.date(startDate, LABKEY.container.formats.dateTimeFormat);
            let endDateFormatted = DateFormat.format.date(endDate, LABKEY.container.formats.dateTimeFormat);

            // remove the table if it exists
            removeEventLog();

            // create a table for start, end and cost in events log
            tableElt = document.createElement('table');
            tableElt.setAttribute('id', 'event-cost-table');
            tableElt.className = 'labkey-data-region-legacy labkey-show-borders';
            tableElt.innerHTML = '<tr><th>Start</th><th>End</th><th>Cost</th></tr>';
            let rowElt = document.createElement('tr');
            rowElt.innerHTML = '<td>' + startDateFormatted + '</td><td>' + endDateFormatted + '</td><td id="event-cost"></td>';
            tableElt.appendChild(rowElt);
            document.querySelector('#events-log').appendChild(tableElt);

            infoElt = document.createElement('div');
            infoElt.setAttribute('id', 'cost-info');
            let infoHtml ='<span id="total-event-cost" style="text-emphasis-color: indianred"></span>';
            infoHtml += '<br>';
            infoHtml += '<p>Click here to view all the time scheduled for this project.</p>';
            infoHtml += '<br>';
            infoHtml += '<p>View the billing FAQ and instructions for scheduling instruction time.</p>';
            infoHtml += '<br>';
            infoHtml += '<p><a href="' + LABKEY.ActionURL.buildURL('query', 'executeQuery', LABKEY.ActionURL.getContainer(), {schemaName: 'targetedms', 'query.queryName': 'InstrumentRate'}) + '">View</a> the current rates for instruments.</p>';
            infoElt.innerHTML = infoHtml;

            document.querySelector('#events-log').appendChild(infoElt);

            $('#event-modal input[name="event-index"]').val(event ? event.id : '');
            $('#event-modal input[name="event-start-date"]').val(startDateFormatted);
            $('#event-modal input[name="event-end-date"]').val(endDateFormatted);
            $('#event-modal input[name="event-name"]').val(event ? event.name : '');
            $('#event-modal input[name="event-notes"]').val(event ? event.notes : '');
            $('#event-modal').modal();
        }

        function closeEvent() {
            $('#schedule-cost-error').text('');
            $('#cost-modal').modal('hide');
        }

        function addEvent() {
            eventToSave.id = $('#event-modal input[name="event-index"]').val();
            eventToSave.startTime = $('#event-modal input[name="event-start-date"]').val();
            eventToSave.endTime = $('#event-modal input[name="event-end-date"]').val();
            eventToSave.project = project;
            eventToSave.instrument = instrument ? instrument : $('#instrumentDropDown select[name="instrumentDropDown"]').val();
            eventToSave.name = $('#event-modal input[name="event-name"]').val();
            eventToSave.notes = $('#event-modal input[name="event-notes"]').val();

            if (eventToSave.endTime < eventToSave.startTime) {
                alert('End date must be after start date');
                return;
            }

            const events = calendar.getEvents();
            // validate that the events time do not overlap with existing events
            for (let i = 0; i < events.length; i++) {
                if (eventToSave.id != events[i].id) {
                    let newEvent = {
                        start: new Date(eventToSave.startTime),
                        end: new Date(eventToSave.endTime)
                    };
                    let existingEvent = {
                        start: events[i].start,
                        end: events[i].end
                    };

                    if (eventsOverlap(newEvent, existingEvent)) {
                        alert('New schedule overlaps with existing instrument schedule');
                        return;
                    }
                }
            }

            // get the paymentMethod and percentPayment from the html fields
            paymentMethods = [];
            let paymentMethodDropDowns = document.querySelectorAll('#paymentMethodDropDown select');
            let percentPaymentFields = document.querySelectorAll('#paymentMethodPercent');
            for (let i = 0; i < paymentMethodDropDowns.length; i++) {
                let paymentMethodId = paymentMethodDropDowns[i].value;
                let paymentMethodPercent = percentPaymentFields[i].value;
                paymentMethods.push({
                    paymentMethod: paymentMethodId,
                    percentPayment: paymentMethodPercent
                });
            }

            // query the instrument rate and rate type
            LABKEY.Query.selectRows({
                schemaName: 'targetedms',
                queryName: 'instrumentRate',
                columns: 'Id,fee,rateType',
                filterArray: [
                    LABKEY.Filter.create('instrument', eventToSave.instrument, LABKEY.Filter.Types.EQUAL)
                ],
                success: function (data) {
                    if (data.rows.length === 0) {
                        $('#schedule-save-error').text('Error calculating cost. No rate found for instrument');
                        return;
                    }
                    let fee = data.rows[0].fee;
                    let rateType = data.rows[0].rateType;
                    let cost = fee * (Math.abs(new Date(eventToSave.endTime) - new Date(eventToSave.startTime))) / 1000 / 60 / 60;


                    // query the rateType
                    LABKEY.Query.selectRows({
                        schemaName: 'targetedms',
                        queryName: 'rateType',
                        columns: 'Id,name,setupFee',
                        filterArray: [
                            LABKEY.Filter.create('Id', rateType, LABKEY.Filter.Types.EQUAL)
                        ],
                        success: function (data) {
                            let setupFee = data.rows[0].setupFee;

                            $('#setup-cost').val(setupFee);
                            $('#instrument-fee').val(cost);
                            $('#total-cost').val(setupFee + cost);

                            // add cost to event-cost-table
                            const costElt = document.getElementById('event-cost');
                            costElt.innerHTML = '$' + (setupFee + cost);

                            const totalEventCostElt = document.getElementById('total-event-cost');
                            totalEventCostElt.innerHTML = 'Total Cost: $' + (setupFee + cost);


                            // open the cost modal
                            $('#cost-modal').modal();
                        },
                        failure: function (errorInfo) {
                            $('#schedule-cost-error').text('Error calculating cost ' + (errorInfo.exception ? errorInfo.exception : ''));
                        }
                    });
                }
            });

            // get the instrument operator
            // check if the instrument is available during the scheduled time
            // Make sure user has not exceeded instrument time quota
            // Email admins


        }

        function saveEvent() {

            let instrumentScheduleCommand = {
                command: eventToSave.id ? 'update' : 'insert',
                schemaName: 'targetedms',
                queryName: 'instrumentSchedule',
                rows: [
                    eventToSave
                ]
            };

            let instrumentUsagePaymentRows = [];
            if (paymentMethods.length > 0) {
                for (let i = 0; i < paymentMethods.length; i++) {
                    instrumentUsagePaymentRows.push({
                        instrumentScheduleId: eventToSave.id,
                        paymentMethod: paymentMethods[i].paymentMethod,
                        percentPayment: paymentMethods[i].percentPayment
                    });
                }
            }

            let instrumentUsagePaymentCommand = {
                command: eventToSave.id ? 'update' : 'insert',
                schemaName: 'targetedms',
                queryName: 'instrumentUsagePayment',
                rows: instrumentUsagePaymentRows
            };


            let commandsToExecute = [instrumentScheduleCommand];
            if (eventToSave.id) {
                commandsToExecute.push(instrumentUsagePaymentCommand);
            }


            LABKEY.Query.saveRows({
                commands: [instrumentScheduleCommand],
                success: function (response) {

                    loadInstrumentSchedule(function (data) {
                        calendar.getEventSources()[0].remove();
                        calendar.addEventSource(data);
                        $('#event-modal').modal('hide');
                        $('#cost-modal').modal('hide');
                    }, true);

                    if (instrumentUsagePaymentRows.length > 0 && !eventToSave.id && response?.result[0]?.rows?.length > 0) {
                        let responseRows = response.result[0].rows;
                        let instrumentScheduleId = responseRows[0].id;
                        for (let i = 0; i < instrumentUsagePaymentRows.length; i++) {
                            instrumentUsagePaymentRows[i].instrumentScheduleId = instrumentScheduleId;
                        }

                        LABKEY.Query.saveRows({
                            commands: [instrumentUsagePaymentCommand],
                            success: function () {
                                // Do nothing
                            },
                            failure: function (errorInfo) {
                                $('#schedule-save-error').text('Error saving. ' + (errorInfo.exception ? errorInfo.exception : ''));
                            }
                        });
                    }
                },
                failure: function (errorInfo) {
                    $('#schedule-save-error').text('Error saving. ' + (errorInfo.exception ? errorInfo.exception : ''));
                }
            });
        }

        function eventsOverlap(newEvent, existingEvent) {
            // Check if newEvent starts after existingEvent ends or ends before existingEvent starts
            return !(newEvent.end <= existingEvent.start || newEvent.start >= existingEvent.end);
        }

        function removeEventLog() {
            let tableElt = document.querySelector('#events-log table');
            if (tableElt) {
                tableElt.remove();
            }
            let infoElt = document.querySelector('#cost-info');
            if (infoElt) {
                infoElt.remove();
            }
        }

        function deleteEvent() {
            removeEventLog()

            const event = {
                id: $('#event-modal input[name="event-index"]').val(),
            }

            LABKEY.Query.saveRows({
                commands: [{
                    command: 'delete',
                    schemaName: 'targetedms',
                    queryName: 'instrumentSchedule',
                    rows: [
                        event
                    ]
                }],
                success: function () {
                    // Don't reload the full data when only the annotations have been edited
                    loadInstrumentSchedule(function (data) {
                        calendar.getEventSources()[0].remove()
                        calendar.addEventSource(data)
                        $('#event-modal').modal('hide');
                    }, true);
                },
                failure: function (errorInfo) {
                    $('#schedule-save-error').text('Error saving. ' + (errorInfo.exception ? errorInfo.exception : ''));
                }
            });
        }

        function loadInstrumentSchedule(callback) {
            let instrumentSchedule = [];
            LABKEY.Query.selectRows({
                schemaName: 'targetedms',
                queryName: 'instrumentSchedule',
                columns: 'Id,startTime,endTime,name,notes,instrument/color,project/Id, project/title',
                filterArray: [
                    LABKEY.Filter.create('instrument', instrument ? instrument : $('#instrumentDropDown select[name="instrumentDropDown"]').val()),
                ],
                success: function (data) {
                    let rows = data.rows;
                    for (let i = 0; i < rows.length; i++) {
                        let row = rows[i];
                        instrumentSchedule.push({
                            id: row.Id,
                            start: new Date(row.startTime),
                            end: new Date(row.endTime),
                            name: row.name,
                            notes: row.notes,
                            color: row['instrument/color'],
                            project: row['project/Id'],
                            title: row['project/title']
                        });
                    }
                    callback(instrumentSchedule);
                }
            });
        }

        $('#add-event').click(function() {
            addEvent();
        });

        $('#close-event').click(function() {
            closeEvent();
        });

        $('#save-event').click(function() {
            saveEvent();
        });

        $('#delete-event').click(function () {
            deleteEvent();
        });

        $('#close-schedule').click(function () {
            $('#schedule-save-error').text('');
            $('#event-modal').modal('hide');
        });

    });
    let paymentMethodsData;
    let paymentMethodCount = 1;
    document.addEventListener('DOMContentLoaded', function () {
        const addPaymentMethodEl = document.getElementById('addPaymentMethod');
        addPaymentMethodEl.addEventListener('click', function () {
            paymentMethodCount++;
            let id = 'paymentMethodDropDown' + paymentMethodCount;
            let paymentMethodDropDown = '<label for=' + id + '>Payment Method:</label>';
            paymentMethodDropDown += '<select id=' + id + ' name=' + id + '">';
            for (let i = 0; i < paymentMethodsData.length; i++) {
                paymentMethodDropDown += '<option value="' + LABKEY.Utils.encodeHtml(paymentMethodsData[i].Id) + '">' + LABKEY.Utils.encodeHtml(paymentMethodsData[i].name) + '</option>';
            }
            paymentMethodDropDown += '</select>';

            paymentMethodDropDown += '&nbsp<input type="text" id="paymentMethodPercent" name="paymentMethodPercent" value="0" size="3" maxlength="3">';
            paymentMethodDropDown += '<label for="paymentMethodPercent">%</label>';

            // TODO: add delete icon
            paymentMethodDropDown += '&nbsp' +
                    '<span id="removePaymentMethod" role="button" style="cursor: pointer;">[Remove]</span>';
            let logElt = document.createElement('div');
            logElt.innerHTML = paymentMethodDropDown;

            document.querySelector('#paymentMethodDropDown').appendChild(logElt);
        });

        document.addEventListener('click', function (event) {
            if (event.target.id === 'removePaymentMethod') {
                event.preventDefault();
                event.target.parentElement.remove();
            }
        });

        // refresh the page on project change
        document.getElementById('projectDropDown').addEventListener('change', function (event) {
            document.location.href = LABKEY.ActionURL.buildURL('targetedms', 'scheduleInstrument', null, {project: event.target.value});

        });

        // refresh the page on instrument change
        document.getElementById('instrumentDropDown').addEventListener('change', function (event) {
            document.location.href = LABKEY.ActionURL.buildURL('targetedms', 'scheduleInstrument', null, {project: LABKEY.ActionURL.getParameter('project'), instrument: event.target.value});
        });

    });
